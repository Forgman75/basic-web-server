<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>POST-запрос</title>
</head>
<body>
    <h1>Отправка сообщения на сервер</h1>

    <form action="/submit" method="POST">
        <label for="message">Введите сообщение:</label>
        <input
            type="text"
            id="message"
            name="message"
            placeholder="Ваше сообщение"
            required
        >

        <button type="submit">Отправить</button>
    </form>
</body>
</html>
